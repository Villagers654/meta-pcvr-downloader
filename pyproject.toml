[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-pcvr-downloader"
version = "0.1.2"
description = "Download and verify Meta/Oculus PCVR games you own on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Villagers654"}]
keywords = ["meta", "oculus", "pcvr", "rift", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/Villagers654/meta-pcvr-downloader"
Issues = "https://github.com/Villagers654/meta-pcvr-downloader/issues"

[project.scripts]
meta-pcvr = "meta_pcvr_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
